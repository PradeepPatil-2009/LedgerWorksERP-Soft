name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Maven / H2 tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend tests
        run: mvn -f ledgerworks-backEnd/pom.xml -B test

  frontend:
    name: Frontend (npm test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledgerworks-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ledgerworks-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test -- --watchAll=false

      - name: Build
        run: CI=false npm run build
