spring.application.name=ledgerworks

# ===== Datasource (env-overridable; defaults match local dev MySQL root/root) =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ledgerworks?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Dialect is auto-detected by Hibernate 6 from the live connection (MySQL 8/9).

# ===== JWT =====
jwt.secret=${JWT_SECRET:}
# Access token TTL (1 hour). Refresh token TTL (7 days).
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ===== Cookies =====
# Secure flag MUST stay false for local DEV over http (else browsers drop cookies).
app.cookie.secure=${COOKIE_SECURE:false}

# ===== Server =====
server.port=${SERVER_PORT:8080}

# ===== CORS (single source; consumed by SecurityConfig.corsConfigurationSource) =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ===== Multipart (data import uploads) =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Mail (all env-driven and optional; app boots with ZERO mail config) =====
# With MAIL_HOST blank the app never actually sends mail (email-enabled defaults false).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== Notifications =====
app.notifications.email-enabled=${NOTIFICATIONS_EMAIL_ENABLED:false}
app.notifications.admin-email=${ADMIN_EMAIL:admin@example.com}
