spring.application.name=ledgerworks

# ===== Datasource (env-overridable; defaults match local dev MySQL root/root) =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ledgerworks?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dialect is auto-detected by Hibernate 6 from the live connection (MySQL 8/9).

# ===== JWT =====
jwt.secret=${JWT_SECRET:LedgerWorksSuperSecretKeyLedgerWorksSuperSecretKey123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== Server =====
server.port=${SERVER_PORT:8080}
