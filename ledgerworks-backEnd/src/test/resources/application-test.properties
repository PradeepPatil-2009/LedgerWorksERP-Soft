# ===== H2 in-memory datasource (tests only) =====
spring.datasource.url=jdbc:h2:mem:lwtest;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ===== JWT (defaults copied from application.properties) =====
jwt.secret=LedgerWorksSuperSecretKeyLedgerWorksSuperSecretKey123456
jwt.expiration=86400000
